<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeX Smoke Tests</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;background:#f5f7fa;color:#172235}li{padding:.7rem;margin:.4rem 0;background:#fff;border-radius:6px} .ok{color:#167a45}.fail{color:#b21f2d}code{direction:ltr;display:inline-block}</style></head>
<body><h1>ForgeX Smoke Tests</h1><p id="summary">جاري الاختبار...</p><ul id="results"></ul>
<script src="../js/forgex-compat.js"></script><script src="../js/forgex-db.js"></script><script>
(function () {
  'use strict';
  var results = [];
  function test(name, check) { try { check(); results.push({name:name, ok:true}); } catch (err) { results.push({name:name, ok:false, error:err.message}); } }
  function assert(condition, message) { if (!condition) throw new Error(message); }
  test('طبقة البيانات متاحة', function () { assert(window.ForgeXDB && ForgeXDB.customers && ForgeXDB.projects, 'ForgeXDB غير متاحة'); });
  test('واجهات الاجتماعات متاحة', function () { assert(ForgeXDB.meetings && Array.isArray(ForgeXDB.meetings.getAll()), 'واجهة الاجتماعات غير صالحة'); });
  test('النسخة الاحتياطية تحتوي الاجتماعات', function () { assert(Array.isArray(ForgeXDB.backup.export().data.meetings), 'الاجتماعات غير موجودة في النسخة'); });
  test('النسخة الاحتياطية قابلة للتحقق', function () { assert(ForgeXDB.backup.validate(ForgeXDB.backup.export()).valid, 'فشل التحقق من نسخة صالحة'); });
  test('توليد أرقام التقارير متاح', function () { assert(typeof ForgeXDB.reports.nextNumber === 'function', 'ترقيم التقارير غير متاح'); });
  test('قواعد الملفات تعمل', function () { assert(ForgeXDB.attachments.validateFile({name:'test.png',size:100}).valid, 'تم رفض ملف صالح'); });
  var passed = results.filter(function (result) { return result.ok; }).length;
  document.getElementById('summary').textContent = passed + '/' + results.length + ' اختبارات ناجحة';
  document.getElementById('results').innerHTML = results.map(function (result) { return '<li class="' + (result.ok ? 'ok' : 'fail') + '">' + (result.ok ? '✓ ' : '✗ ') + result.name + (result.error ? ' - ' + result.error : '') + '</li>'; }).join('');
})();
</script></body></html>
